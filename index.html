<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso · que no se te olvide nada</title>
<meta name="description" content="Listas para repasar antes de un viaje, de salir de casa o de ir a entrenar.">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111615" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Repaso">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1d2a2a;--muted:#6b7676;--line:#e7e3da;
  --accent:#127c6e;--accent-ink:#fff;--soft:#dcefeb;--warn:#c2410c;--warn-soft:#fdeee4;
  --gold:#d99a1e;--done:#a3acaa;--r:18px;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111615;--card:#1a2120;--ink:#e9efed;--muted:#95a3a0;--line:#2a3331;
  --accent:#3fbfa9;--accent-ink:#0b1a17;--soft:#1f3a35;--warn:#fb923c;--warn-soft:#3a2418;
  --gold:#f2b84b;--done:#5f6b69;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.muted{color:var(--muted)}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:6px}
.top .tt{flex:1;min-width:0}
.top h1{font-size:19px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{font-size:13px;color:var(--muted);display:block}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none}
.ib:active{background:var(--line)}
.ib.on{background:var(--soft);color:var(--accent)}
.wrap{padding:0 16px}
.hero{padding:calc(14px + env(safe-area-inset-top)) 18px 4px;display:flex;align-items:flex-start;gap:10px}
.hero h1{font-size:30px;margin:0;letter-spacing:-.02em}
.hero p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:24px 4px 8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.h2 button{text-transform:none;letter-spacing:0;color:var(--accent);font-weight:600;font-size:14px}
/* tarjetas de lista */
.lc{display:flex;align-items:center;gap:6px;padding:0 12px 0 0;margin:10px 0;width:100%}
.lcb{display:flex;align-items:center;gap:12px;padding:14px;flex:1;min-width:0;text-align:left}
.lc .tx{flex:1;min-width:0}
.lc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.lc small{color:var(--muted);font-size:13.5px}
.ring{position:relative;width:48px;height:48px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--accent);margin-right:4px;margin-top:4px}
.badge.w{background:var(--warn-soft);color:var(--warn)}
.next{padding:16px;margin:12px 0;background:linear-gradient(135deg,var(--accent),#0d5f55);color:#fff;border:0;border-radius:var(--r);display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.next .em{font-size:34px}
.next b{display:block;font-size:17px}
.next small{opacity:.85}
.next .big{margin-left:auto;text-align:center;font-weight:800;font-size:28px;line-height:1}
.next .big small{display:block;font-size:11px;font-weight:600;opacity:.85}
.quick{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qk{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:78px;padding:12px 4px;font-size:12.5px;font-weight:600;text-align:center}
.qk .em{font-size:28px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin:4px 16px 8px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.filters{display:flex;gap:8px;padding:0 16px 4px;overflow-x:auto;scrollbar-width:none}
.fc{flex:none;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:13.5px;background:var(--card)}
.fc.on{border-color:var(--accent);color:var(--accent);background:var(--soft);font-weight:600}
.fc.w{border-color:transparent;background:var(--warn-soft);color:var(--warn);font-weight:600}
.empty{text-align:center;padding:24px 20px 8px;color:var(--muted)}
.empty .big{font-size:56px}
.empty b{color:var(--ink);display:block;font-size:18px;margin:6px 0 2px}
/* plantillas */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:112px;position:relative;width:100%}
.tile .em{font-size:30px}
.tile b{font-size:15.5px}
.tile small{color:var(--muted);font-size:12.5px;line-height:1.3}
.tile .x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:9px;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .em{font-size:24px;width:32px;text-align:center}
.row .tx{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:13px}
.row .go{color:var(--muted);font-size:20px}
details{border-top:1px solid var(--line)}
details:first-child{border-top:0}
summary{padding:14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--muted)}
details[open] summary::after{content:"－"}
details p{margin:0;padding:0 14px 14px;color:var(--muted)}
/* asistente */
.wz{padding:8px 20px 20px}
.wz .wz-ic{font-size:40px;margin:6px 0 4px}
.wz h2{font-size:26px;margin:0 0 6px;letter-spacing:-.01em;line-height:1.2}
.wz>p{margin:0 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opts.one{grid-template-columns:1fr}
.op{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);text-align:left;min-height:62px;position:relative}
.op .em{font-size:26px;flex:none}
.op b{display:block;font-size:15.5px;font-weight:600}
.op small{display:block;color:var(--muted);font-size:12.5px;line-height:1.25;margin-top:2px}
.op.on{border-color:var(--accent);background:var(--soft)}
.op.on::after{content:"✓";position:absolute;top:6px;right:9px;color:var(--accent);font-weight:800;font-size:14px}
.step{display:flex;align-items:center;justify-content:center;gap:22px;margin:26px 0 18px}
.step button{width:58px;height:58px;border-radius:18px;border:2px solid var(--line);font-size:26px;background:var(--card)}
.step output{font-size:48px;font-weight:800;min-width:70px;text-align:center}
.qchips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:15px}
.chip.on{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
.inp{width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);outline:none;font-size:16px}
.inp:focus{border-color:var(--accent)}
.big-inp{font-size:20px;padding:16px;margin-top:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bottom>div{max-width:608px;margin:0 auto;display:flex;gap:10px}
.btn{display:block;width:100%;padding:16px;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center;font-size:16.5px}
.btn.sec{background:var(--soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--muted);width:auto;padding:16px 18px}
.sumc{padding:16px;margin:14px 0}
.info{background:var(--soft);border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:14.5px}
.info b{display:block;font-weight:600}
.info small{display:block;color:var(--muted);margin-top:2px;font-size:13px}
.pres{margin-top:10px}
.pres .op{width:100%;margin-top:8px}
.due{font-size:11px;font-weight:700;color:#fff;background:var(--warn);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.it{position:relative;background:var(--card);transition:transform .2s}
.swbg{position:absolute;inset:0;background:var(--warn);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;font-weight:700;font-size:14px}
.reuse{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:8px 10px;border-radius:10px;flex:none}
.stats{display:flex;gap:10px;margin-top:12px}
.stats div{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:24px}
.stats small{color:var(--muted);font-size:12px}
.ans{display:flex;justify-content:space-between;gap:10px;padding:12px 2px;border-top:1px solid var(--line);width:100%;text-align:left}
.ans:first-child{border-top:0}
.ans span{color:var(--muted);font-size:14px}
.ans b{font-size:14.5px;text-align:right;font-weight:600}
.ans b::after{content:" ›";color:var(--muted)}
/* lista */
.prog{padding:0 16px 10px}
.prog .r{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:5px}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .3s}
.coach{margin:4px 16px 10px;padding:14px 16px;background:var(--soft);border-radius:var(--r)}
.coach b{display:block;margin-bottom:6px;color:var(--accent)}
.coach ul{margin:0 0 10px;padding-left:20px;font-size:14.5px}
.coach li{margin:3px 0}
.coach button{font-weight:700;color:var(--accent)}
.sec{margin:12px 16px;overflow:hidden;position:relative}
.sh{display:flex;align-items:center;gap:8px;padding:13px 14px;width:100%;text-align:left}
.sh h3{margin:0;font-size:16px;flex:1;min-width:0}
.sh .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:1px}
.sh .ct{font-size:13px;color:var(--muted);font-weight:600}
.sh .ct.ok{color:var(--accent)}
.sh .chev{color:var(--muted);transition:transform .2s;font-size:14px}
.sec.col .chev{transform:rotate(-90deg)}
.it{display:flex;align-items:center;gap:2px;padding:0 6px 0 14px;border-top:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:12px 0;text-align:left}
.box{width:25px;height:25px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;transition:.15s}
.it.imp .box{border-color:var(--warn)}
.it.d .box{background:var(--accent);border-color:var(--accent);animation:pop .25s}
.it.d .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.it.d .t{color:var(--done);text-decoration:line-through}
.t{word-break:break-word}
.tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.imp{background:var(--warn-soft);color:var(--warn)}
.tag.u{background:var(--soft);color:var(--accent)}
.it.d .tag{opacity:.5}
.del{width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:16px;flex:none;opacity:.55}
.del:active{background:var(--line);opacity:1}
.mini{width:32px;height:34px;border-radius:9px;color:var(--muted);font-size:15px;flex:none}
.mini.on{color:var(--gold)}
.it .inp{padding:8px 10px;margin:6px 0;flex:1;min-width:0}
.add{display:flex;gap:6px;padding:6px 8px 8px 14px;border-top:1px solid var(--line);align-items:center}
.add input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:9px 0;font-size:16px}
.add input::placeholder{color:var(--muted)}
.add .plus{width:36px;height:36px;border-radius:11px;background:var(--soft);color:var(--accent);font-size:22px;font-weight:700;flex:none}
.add .sg{height:36px;padding:0 10px;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted);border:1.5px solid var(--line);flex:none}
.add .sg.on{color:var(--accent);border-color:var(--accent)}
.sugs{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.sugs .chip{font-size:13.5px;padding:6px 11px}
.sugs .chip::before{content:"+ ";color:var(--accent);font-weight:700}
.party{margin:4px 16px 10px;padding:18px;text-align:center;background:var(--soft);color:var(--accent);border-radius:var(--r);font-weight:700}
.party small{display:block;font-weight:500;margin-top:4px}
.hint{font-size:13.5px;color:var(--muted);padding:2px 20px 6px}
/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar>div{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 14px;min-width:70px}
.tab .em{font-size:21px;filter:grayscale(1);opacity:.7}
.tab.on{color:var(--accent)}
.tab.on .em{filter:none;opacity:1}
.plusb{width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-size:30px;font-weight:600;margin-top:-26px;box-shadow:0 6px 18px rgba(18,124,110,.35);display:grid;place-items:center}
/* hojas */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:4px 0 4px;font-size:21px}
.sheet h2+p{margin-top:0}
.mi{display:flex;gap:14px;align-items:center;width:100%;padding:14px 12px;text-align:left;border-radius:12px;font-size:16px}
.mi small{display:block;color:var(--muted);font-size:13px}
.mi:active{background:var(--line)}
.mi.red{color:var(--warn)}
.sheet p{color:var(--muted);margin:6px 0 12px}
.sheet ol{padding-left:22px;margin:6px 0 14px}
.sheet li{margin:5px 0}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
.emojis button{font-size:28px;padding:10px 0;border-radius:12px}
.emojis button:active,.emojis button.on{background:var(--soft)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fd{from{opacity:0}}
@keyframes pop{50%{transform:scale(1.2)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 14px 12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;z-index:30;width:max-content;max-width:94%;font-size:14.5px;animation:fd .2s;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast span{flex:1}
.toast button{color:var(--accent);font-weight:700;filter:brightness(1.35);white-space:nowrap}
@media (prefers-color-scheme:dark){.toast button{filter:brightness(.7)}}
/* tutorial */
.tut{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:fd .25s}
.tut .slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.tut .slides::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;scroll-snap-align:center;padding:calc(30px + env(safe-area-inset-top)) 28px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow-y:auto}
.slide .art{font-size:76px;margin:18px 0 8px}
.slide h2{font-size:27px;margin:8px 0;letter-spacing:-.01em}
.slide p{color:var(--muted);font-size:16.5px;max-width:420px;margin:0 0 18px}
.demo{width:100%;max-width:340px;text-align:left;pointer-events:none}
.demo .it{padding-left:12px}
.demo .lbl{font-size:12px;color:var(--accent);font-weight:700;padding:6px 12px 0}
.dots{display:flex;justify-content:center;gap:7px;padding:10px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:.2s}
.dots i.on{width:22px;background:var(--accent)}
.tut .nav{display:flex;gap:10px;padding:8px 20px calc(18px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;width:100%}
.cf{position:fixed;top:-20px;z-index:50;font-size:22px;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ===================== Utilidades ===================== */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const has = (arr, v) => (arr || []).includes(v);
const x = (t, n) => n > 1 ? `${t} ×${n}` : t;
const KEY = "repaso.v1";
const DEF = () => ({lists:[], templates:[], learn:{}, seen:{}, settings:{learn:true}});
function load(){
  let d = null; try{ d = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  d = Object.assign(DEF(), d || {});
  d.seen = d.seen || {}; d.learn = d.learn || {}; d.settings = Object.assign({learn:true}, d.settings || {});
  d.lists.forEach(l => l.sections.forEach(s => { s.kind = s.kind || "pack"; }));
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("No se ha podido guardar"); } }
let S = load();

/* Constructor de listas. "!" al principio = imprescindible. */
function B(){
  const secs = []; let cur = null; const seen = new Set();
  return {
    sec(title, kind = "pack", when){ cur = secs.find(s => s.title === title); if(!cur){ cur = {title, kind, items:[]}; if(when) cur.when = when; secs.push(cur); } return this; },
    add(text, cond = true){
      if(!cond || !text) return this;
      const imp = text[0] === "!"; const t = imp ? text.slice(1) : text;
      if(!seen.has(t)){ seen.add(t); cur.items.push({t, imp}); }
      return this;
    },
    done(){ return secs.filter(s => s.items.length); }
  };
}

/* ===================== Países =====================
   flags: U = UE, E = EEE (roaming incluido), D = vale el DNI, L = conducen por la izquierda
   [nombre, flags, moneda ("" = euro), enchufes, nota de entrada] */
const C = {
  ES:["España","UED","","CF"],

/* ===================== Tiempo (Open-Meteo, sin clave) ===================== */
const localISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const iso = localISO;
async function fetchWx(a){
  if(!a.place || a.place.lat == null || !a.fecha || !navigator.onLine) return;
  const key = `${a.place.lat},${a.place.lon},${a.fecha},${a.dias}`;
  if(a.wx && a.wx.key === key) return;
  a.wx = {key, loading:true};
  try{
    const start = new Date(a.fecha + "T12:00:00"), end = new Date(start); end.setDate(end.getDate() + Math.max(0, (a.dias | 0) - 1));
    const today = new Date(); today.setHours(12, 0, 0, 0);
    const ahead = Math.round((start - today) / 864e5);
    let url, src;
    if(ahead <= 14){
      const e2 = new Date(today); e2.setDate(e2.getDate() + 15);
      url = `https://api.open-meteo.com/v1/forecast?latitude=${a.place.lat}&longitude=${a.place.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&timezone=auto&start_date=${iso(start < today ? today : start)}&end_date=${iso(end > e2 ? e2 : end)}`;
      src = "Previsión del tiempo";
    } else {
      const s1 = new Date(start), e1 = new Date(end); s1.setFullYear(s1.getFullYear() - 1); e1.setFullYear(e1.getFullYear() - 1);
      url = `https://archive-api.open-meteo.com/v1/archive?latitude=${a.place.lat}&longitude=${a.place.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&start_date=${iso(s1)}&end_date=${iso(e1)}`;
      src = "Estimado con el tiempo de esas fechas el año pasado";
    }
    const r = await fetch(url); const j = await r.json(); const d = j.daily;
    const avg = arr => arr.filter(v => v != null).reduce((s, v) => s + v, 0) / Math.max(1, arr.filter(v => v != null).length);
    const tmax = avg(d.temperature_2m_max), tmin = avg(d.temperature_2m_min);
    const wet = d.precipitation_sum.filter(v => v >= 1).length / d.precipitation_sum.length;
    const prob = d.precipitation_probability_max ? Math.max(...d.precipitation_probability_max.filter(v => v != null)) : 0;
    const rain = wet >= .25 || prob >= 50;
    const est = tmax >= 25 ? "verano" : tmax <= 13 ? "invierno" : "entretiempo";
    if(a.wx.key !== key) return;
    a.wx = {key, tmin:Math.round(tmin), tmax:Math.round(tmax), rain, est, src};
    a.estacion = est; a.lluvia = rain;
  }catch(e){ a.wx = {key, error:true}; }
  if(view.name === "wizard" && view.a === a){ const q = curQ(); if(!q || !["text","date","place"].includes(q.type)) render(); }
}
function wxCard(a){
  if(!a.place || a.place.lat == null) return "";
  const w = a.wx; if(!w) return !a.fecha ? `<div class="info">💡 Si pones la fecha de salida, miro el tiempo que hará en ${esc(a.place.name)}.</div>` : "";
  if(w.loading) return `<div class="info">⏳ Mirando el tiempo en ${esc(a.place.name)}…</div>`;
  if(w.error) return `<div class="info">No he podido consultar el tiempo. Elige tú:</div>`;
  return `<div class="info"><b>${w.rain ? "🌧️" : w.est === "verano" ? "☀️" : w.est === "invierno" ? "❄️" : "🌤️"} ${esc(a.place.name)}: entre ${w.tmin} y ${w.tmax} °C${w.rain ? ", con lluvia probable" : ""}</b><small>${w.src}. Ya lo he marcado; cámbialo si quieres.</small></div>`;
}

function packing(b, a, opt = {}){

  const W = (mot === "trabajo" || mot === "curso") ? Math.max(0, Math.min(a.diasTrab ?? n, n)) : mot === "evento" ? 1 : 0;
  const Wc = lav ? Math.min(W, 5) : Math.min(W, 10);
  const formal = W > 0 && dress !== "informal";
  const casual = Math.max(1, c - (formal ? Wc : 0) + (formal ? 1 : 0));
  const est = a.estacion, act = a.actividades || [];

      .add("Plancha o vaporizador de viaje", Wc >= 3)

    else sec
      .add(x("Camisas, blusas o polos", Wc + (Wc >= 3 ? 1 : 0)))
      .add(x("Pantalones de vestir o chinos", Math.max(1, Math.ceil(Wc / 2))))
      .add("Americana o blazer")
      .add("Zapatos arreglados").add("Cinturón")
      .add("Jersey fino (por el aire acondicionado)", Wc >= 2);
  }

    .add("Zapatos para el evento", dress !== "informal").add("Complementos").add("Chaqueta o chal para la noche")
    .add("Regalo o sobre", true).add("Invitación o entrada");
  if(agua) b.sec("🏖️ Playa y piscina")
    .add(x("Bañador", n > 2 ? 2 : 1)).add("Toalla de playa").add("Chanclas")
    .add("Gorra o sombrero").add("After sun").add("Funda estanca para el móvil", has(act,"playa"));
  if(has(act,"montana")) b.sec("🥾 Montaña")
    .add("Botas o zapatillas de montaña").add("Mochila pequeña de día").add("Cantimplora")

  if(has(act,"nieve")) b.sec("⛷️ Nieve")

    .add("Casco").add("Forfait").add("Calcetines térmicos").add("Cacao labial");
  if(has(act,"deporte")) b.sec("🏃 Deporte")

  if(has(act,"elegante")) b.sec("🍷 Para arreglarse")
    .add("Conjunto arreglado").add("Zapatos de vestir").add("Complementos");
  if(W > 0 && mot !== "evento" && !opt.workDone) b.sec("💼 Trabajo")
    .add("!Portátil y cargador").add("Documentación del trabajo o del curso").add("Cuaderno y bolígrafo").add("Adaptador USB-C / HDMI");

  const liq = opt.mano;

/* Genera aplicando lo aprendido (añadidos y descartes) */
function generate(k, a){
  let secs = T[k].build(a);
  const L = S.learn[k];
  if(L && S.settings.learn){
    const hide = new Set(L.hide || []);
    secs.forEach(s => s.items = s.items.filter(i => !hide.has(i.t)));
    Object.entries(L.add || {}).forEach(([title, items]) => {
      let s = secs.find(s => s.title === title);
      if(!s){ s = {title, kind:"pack", items:[]}; secs.push(s); }
      items.forEach(t => { if(!s.items.some(i => i.t === t)) s.items.push({t, u:true}); });
    });
    secs = secs.filter(s => s.items.length);
  }
  return secs;
}
function defaults(k){ const a = {}; T[k].qs.forEach(q => a[q.id] = Array.isArray(q.def) ? [...q.def] : q.def); return a; }

/* Catálogo de sugerencias por sección (todas las combinaciones) */
let CAT = null;
function catalog(){
  if(CAT) return CAT; CAT = new Map();
  const put = secs => secs.forEach(s => { if(!CAT.has(s.title)) CAT.set(s.title, new Set()); s.items.forEach(i => CAT.get(s.title).add(i.t)); });
  Object.keys(T).forEach(k => {
    const t = T[k], base = defaults(k);
    t.qs.forEach(q => { if(q.type === "multi") base[q.id] = q.opts.map(o => o[0]); if(q.type === "toggle") base[q.id] = true; });
    base.dias = 7;
    put(t.build(base));
    t.qs.filter(q => q.type === "choice").forEach(q => q.opts.forEach(o => {
      put(t.build({...base, [q.id]:o[0]}));
      put(t.build({...base, [q.id]:o[0], divisa:false, ducha:false}));
    }));
    put(t.build({...base, divisa:false, mano:false}));
  });
  return CAT;
}

}

const allItems = l => l.sections.flatMap(s => s.items);
const count = l => { const a = allItems(l); return {n:a.length, d:a.filter(i => i.d).length, imp:a.filter(i => i.imp && !i.d).length}; };
const plain = l => l.sections.map(s => ({title:s.title, kind:s.kind, when:s.when, items:s.items.map(i => ({t:i.t, imp:i.imp}))}));
const snap = () => JSON.stringify(S);
function restore(j){ S = JSON.parse(j); save(); render(); }
function daysTo(date){ if(!date) return null; const t = new Date(date + "T00:00:00"), n = new Date(); n.setHours(0,0,0,0); return Math.round((t - n) / 864e5); }
function whenTxt(d){ if(d === null) return ""; if(d === 0) return "¡Sales hoy!"; if(d === 1) return "Sales mañana"; if(d > 1) return `Faltan ${d} días`; if(d === -1) return "Fue ayer"; return `Hace ${-d} días`; }
const learnOf = k => (S.learn[k] = S.learn[k] || {add:{}, hide:[]});

/* ===================== Navegación ===================== */
let view = {name:"home"};
let ui = {edit:false, hide:false, imp:false, col:{}, sug:null};
function go(v, replace){ view = v; ui.edit = false; ui.hide = false; ui.imp = false; ui.sug = null;
  replace ? history.replaceState(v, "") : history.pushState(v, ""); render(); scrollTo(0, 0); }
let leaving = false;
addEventListener("popstate", e => {
  // El botón «atrás» del móvil cierra primero lo que esté abierto
  if(leaving){ leaving = false; closeSheet(); view = e.state || {name:"home"}; ui.edit = false; ui.sug = null; render(); return; }
  const tut = $("#tut");
  if($("#ov") || tut){ closeSheet(); if(tut){ S.seen.tutorial = true; save(); tut.remove(); } history.pushState(view, ""); return; }
  if(ui.edit && view.name === "list"){ ACT.edit(); history.pushState(view, ""); return; }
  if(view.name === "wizard" && view.step > 0){ ACT.wback(); history.pushState(view, ""); return; }
  view = e.state || {name:"home"}; ui.edit = false; ui.sug = null; render();
});

/* ===================== Render ===================== */
function render(){
  if(view.name === "list" && !getList(view.id)) view = {name:"home"};
  const V = {home:homeHTML, tpls:tplsHTML, help:helpHTML, wizard:wizardHTML, list:listHTML}[view.name] || homeHTML;
  $("#app").innerHTML = V();
  if(view.name === "wizard"){ const i = $(".big-inp"); if(i && !i.value && (i.type === "text" || i.type === "search")) setTimeout(() => i.focus(), 250); }
}

function tabbar(){
  const t = (n, em, l) => `<button class="tab ${view.name === n ? "on" : ""}" data-act="tab" data-v="${n}"><span class="em">${em}</span>${l}</button>`;
  return `<nav class="tabbar"><div>${t("home","📋","Listas")}${t("tpls","✨","Plantillas")}<button class="plusb" data-act="new" aria-label="Nueva lista">＋</button>${t("help","💬","Ayuda")}</div></nav>`;
}

function ring(p, icon, size = 48){
  const r = size / 2 - 3.5, C = 2 * Math.PI * r;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"/></svg><span>${esc(icon)}</span></div>`;
}

function greeting(){ const h = new Date().getHours(); return h < 6 ? "Buenas noches" : h < 14 ? "Buenos días" : h < 21 ? "Buenas tardes" : "Buenas noches"; }

function homeHTML(){
  const lists = [...S.lists].sort((a, b) => b.created - a.created);
  const filt = view.f || "act";
  const done = l => { const c = count(l); return c.n > 0 && c.d === c.n; };
  const active = lists.filter(l => !done(l)), finished = lists.filter(done);
  let h = `<div class="hero"><div style="flex:1"><p>${greeting()} 👋</p><h1>Repaso</h1></div></div><div class="wrap">`;
  // Próximo viaje
  const up = lists.filter(l => l.date && daysTo(l.date) >= 0 && !done(l)).sort((a, b) => a.date.localeCompare(b.date))[0];
  if(up){ const c = count(up), d = daysTo(up.date);
    h += `<button class="next" data-act="open" data-id="${up.id}"><span class="em">${esc(up.icon)}</span><span><b>${esc(up.name)}</b><small>${c.d} de ${c.n} repasados${c.imp ? ` · ${c.imp} imprescindibles pendientes` : ""}</small></span><span class="big">${d === 0 ? "HOY" : d}<small>${d === 0 ? "" : d === 1 ? "día" : "días"}</small></span></button>`; }
  h += `<div class="h2">Empieza rápido</div><div class="quick">` + Object.entries(T).map(([k, t]) =>
    `<button class="card qk" data-act="tpl" data-k="${k}"><span class="em">${t.icon}</span>${t.name}</button>`).join("") +
    S.templates.map(t => `<button class="card qk" data-act="mytpl" data-id="${t.id}"><span class="em">${esc(t.icon)}</span>${esc(t.name.length > 18 ? t.name.slice(0, 16) + "…" : t.name)}</button>`).join("") + `</div>`;
  if(!lists.length){
    h += `<div class="empty"><div class="big">🧳</div><b>Aún no tienes listas</b><p>Toca una de arriba o el botón <b style="display:inline;font-size:inherit;color:var(--accent)">＋</b>. Te haré unas preguntas y la lista se crea sola.</p></div>`;
  } else {
    h += `<div class="h2">Mis listas</div>`;
    if(finished.length) h += `<div class="seg" style="margin:0 0 6px"><button class="${filt === "act" ? "on" : ""}" data-act="hf" data-v="act">En curso (${active.length})</button><button class="${filt === "fin" ? "on" : ""}" data-act="hf" data-v="fin">Completadas (${finished.length})</button></div>`;
    const show = finished.length && filt === "fin" ? finished : active;
    if(!show.length) h += `<p class="empty">Todo repasado. 🎉 Crea una nueva con ＋.</p>`;
    h += show.map(l => { const c = count(l), p = c.n ? c.d / c.n : 0, d = daysTo(l.date);
      const fin = c.n && c.d === c.n;
      return `<div class="card lc"><button class="lcb" data-act="open" data-id="${l.id}">${ring(p, l.icon)}<span class="tx"><b>${esc(l.name)}</b><small>${c.d} de ${c.n} repasados</small><span>${d !== null && d >= -1 ? `<span class="badge">${whenTxt(d)}</span>` : ""}${c.imp && c.d < c.n ? `<span class="badge w">⚠️ ${c.imp} imprescindible${c.imp > 1 ? "s" : ""}</span>` : ""}${fin ? `<span class="badge">✓ Todo listo</span>` : ""}</span></span>${fin ? "" : `<span style="color:var(--muted)">›</span>`}</button>${fin ? `<button class="reuse" data-act="reuse" data-id="${l.id}">🔄 Otra vez</button>` : ""}</div>`; }).join("");
  }
  return h + `</div>` + tabbar();
}

/* ---------- Asistente paso a paso ---------- */
const vis = (t, a) => t.qs.filter(q => !q.show || q.show(a));
const isEmpty = v => v === undefined || v === null || v === "" ;
function fmt(q, v){
  if(q.type === "toggle") return v ? "Sí" : "No";
  if(q.type === "choice"){ const o = q.opts.find(o => o[0] === v); return o ? o[1] + " " + o[2] : "—"; }
  if(q.type === "multi") return (v || []).length ? q.opts.filter(o => has(v, o[0])).map(o => o[1]).join(" ") : "Nada";
  if(q.type === "place") return (view.a.place ? view.a.place.name + (C[view.a.place.cc] && C[view.a.place.cc][0] !== view.a.place.name ? ", " + C[view.a.place.cc][0] : "") : (v || "—"));
  if(q.type === "date") return v ? new Date(v + "T00:00:00").toLocaleDateString("es-ES", {weekday:"short", day:"numeric", month:"short"}) : "Sin fecha";
  if(q.type === "number") return v + (q.id === "dias" || q.id === "diasTrab" ? (v == 1 ? " día" : " días") : "");
  return v || "—";
}
function wizardHTML(){
  const t = T[view.k], a = view.a, qs = vis(t, a), n = qs.length, st = Math.min(view.step, n);
  let h = `<div class="top"><button class="ib" data-act="wback" aria-label="Atrás">←</button><div class="tt"><div class="bar"><i style="width:${Math.round(st / n * 100)}%"></i></div><small style="margin-top:4px">${t.icon} ${t.name} · ${st < n ? `paso ${st + 1} de ${n}` : "revisar"}</small></div><button class="ib" data-act="wclose" aria-label="Cerrar">✕</button></div>`;
  if(st < n){
    const q = qs[st], v = a[q.id];
    h += `<div class="wz"><h2>${lbl(q, a)}</h2>${hnt(q, a) ? `<p class="muted">${hnt(q, a)}</p>` : ""}${qBody(q, a)}</div>`;
    const auto = q.type === "choice" || q.type === "toggle";
    h += `<div class="bottom"><div>${q.optional && isEmpty(v) ? `<button class="btn" data-act="wnext">Saltar</button>` : `<button class="btn ${auto ? "sec" : ""}" data-act="wnext">Siguiente</button>`}</div></div>`;
  } else {
    const secs = generate(view.k, a), items = secs.flatMap(s => s.items);
    const doN = secs.filter(s => s.kind === "do").reduce((n, s) => n + s.items.length, 0);
    const imp = items.filter(i => i.imp).length;
    h += `<div class="wz"><h2>¡Lista preparada!</h2><p class="muted">Ponle nombre, revisa tus respuestas y créala. Luego podrás añadir o quitar lo que quieras.</p>
      <input class="inp big-inp" style="margin-top:4px" data-in="wname" value="${esc(view.lname ?? t.title(a))}" aria-label="Nombre de la lista">
      <div class="card sumc"><div class="stats"><div><b>${items.length}</b><small>en total</small></div>${doN ? `<div><b>${doN}</b><small>por hacer</small></div><div><b>${items.length - doN}</b><small>para llevar</small></div>` : `<div><b>${secs.length}</b><small>secciones</small></div>`}<div><b style="color:var(--warn)">${imp}</b><small>imprescindibles</small></div></div></div>
      <div class="card" style="padding:4px 14px">${qs.map((q, i) => `<button class="ans" data-act="wjump" data-v="${i}"><span>${lbl(q, a)}</span><b>${esc(fmt(q, a[q.id]))}</b></button>`).join("")}</div>
      </div><div class="bottom"><div><button class="btn" data-act="create">Crear lista ✓</button></div></div>`;
  }
  return h;
}
function qBody(q, a){
  const v = a[q.id];
  const op = (on, val, em, l, sub) => `<button class="op ${on ? "on" : ""}" data-act="ans" data-q="${q.id}" data-v="${val}"><span class="em">${em}</span><span><b>${l}</b>${sub ? `<small>${sub}</small>` : ""}</span></button>`;
  let pre = "";
  if(q.id === "destino" && a.place){ const k = country(a.place.cc);
    if(k) pre = `<div class="info"><b>📍 ${esc(a.place.name)}${a.place.name !== k.name ? `, ${esc(k.name)}` : ""}</b><small>${[k.cc === "ES" ? "En España" : k.eu ? "Unión Europea" : "Fuera de la UE", k.cc === "ES" ? "" : k.dni ? "vale el DNI" : "necesitas pasaporte", k.cc === "ES" ? "" : k.eea ? "roaming incluido" : "roaming aparte", k.cur ? `se paga en ${k.cur}` : "", k.adapter ? `enchufe tipo ${k.plugTxt} (necesitas adaptador)` : "", k.left ? "conducen por la izquierda" : "", k.entry].filter(Boolean).join(" · ")}. Ya lo he marcado.</small></div>`; }
  if(q.id === "estacion" || q.id === "lluvia") pre = wxCard(a);
  if(q.type === "choice"){ const one = q.opts.some(o => o[3]); return pre + `<div class="opts ${one ? "one" : ""}">${q.opts.map(o => op(v === o[0], o[0], o[1], o[2], o[3])).join("")}</div>`; }
  if(q.type === "multi") return `<div class="opts">${q.opts.map(o => op(has(v, o[0]), o[0], o[1], o[2])).join("")}</div>`;
  if(q.type === "toggle") return pre + `<div class="opts">${op(v === true, "1", "👍", "Sí")}${op(v === false, "0", "👎", "No")}</div>`;
  if(q.type === "number") return `<div class="step"><button data-act="num" data-q="${q.id}" data-v="-1" aria-label="Menos">−</button><output>${v}</output><button data-act="num" data-q="${q.id}" data-v="1" aria-label="Más">+</button></div>
    <div class="qchips">${(q.quick || []).filter(n => n <= qmax(q, a)).map(n => `<button class="chip ${v === n ? "on" : ""}" data-act="numset" data-q="${q.id}" data-v="${n}">${n}</button>`).join("")}</div>`;
  if(q.type === "place") return `<input class="inp big-inp" type="search" data-in="place" value="${esc(v || "")}" placeholder="${esc(q.ph || "")}" enterkeyhint="search" autocomplete="off">
    <div class="pres" id="pres">${a.place ? `<div class="op on"><span class="em">📍</span><span><b>${esc(a.place.name)}</b><small>${esc(a.place.sub)}</small></span></div>` : ""}</div>`;
  if(q.type === "text") return `<input class="inp big-inp" type="text" data-in="ans" data-q="${q.id}" value="${esc(v || "")}" placeholder="${esc(q.ph || "")}" enterkeyhint="next">`;
  if(q.type === "date") return `<input class="inp big-inp" type="date" data-in="ans" data-q="${q.id}" value="${esc(v || "")}" min="${localISO(new Date())}">`;
  return "";
}

/* ---------- Lista ---------- */
function listHTML(){
  const l = getList(view.id), E = ui.edit, c = count(l), p = c.n ? c.d / c.n : 0, d = daysTo(l.date);
  const kinds = new Set(l.sections.map(s => s.kind)), both = kinds.has("do") && kinds.has("pack");
  const f = both ? (view.f || "all") : "all";
  const sub = [whenTxt(d), `${c.d} de ${c.n}`].filter(Boolean).join(" · ");
  let h = `<div class="top"><button class="ib" data-act="back" aria-label="Atrás">←</button>` +
    (E ? `<button class="ib" data-act="icon" style="font-size:24px;background:var(--card);border:1px solid var(--line)" aria-label="Cambiar icono">${esc(l.icon)}</button><input class="inp" style="flex:1;min-width:0" data-in="lname" value="${esc(l.name)}">`
       : `<div class="tt"><h1>${esc(l.icon)} ${esc(l.name)}</h1><small>${sub}</small></div>`) +
    `<button class="ib ${E ? "on" : ""}" data-act="edit" aria-label="${E ? "Terminar de editar" : "Editar"}">${E ? "✓" : "✏️"}</button>` +

/* ===================== Calendario (.ics) ===================== */
function downloadICS(l){
  const d0 = new Date(l.date + "T00:00:00"), now = new Date();
  const stamp = now.toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const at = (days, h, m = 0) => { const d = new Date(d0); d.setDate(d.getDate() + days); d.setHours(h, m, 0, 0); return d; };
  const f = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}T${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}00`;
  const tx = t => t.replace(/\\/g, "\\\\").replace(/[,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const pend = w => l.sections.filter(s => w ? s.when === w : true).flatMap(s => s.items.filter(i => !i.d).map(i => "☐ " + i.t));
  const ev = [];
  const add = (d, title, items) => { if(d < now) return; ev.push(["BEGIN:VEVENT", `UID:${l.id}-${ev.length}@repaso`, `DTSTAMP:${stamp}`, `DTSTART:${f(d)}`, "DURATION:PT15M",
    `SUMMARY:${tx(title)}`, `DESCRIPTION:${tx((items.length ? items.slice(0, 40).join("\n") + "\n\n" : "") + "Abre Repaso para marcarlo.")}`,
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${tx(title)}`, "TRIGGER:PT0S", "END:VALARM", "END:VEVENT"].join("\r\n")); };
  const hasW = l.sections.some(s => s.when);
  if(hasW){
    add(at(-7, 19), `${l.icon} ${l.name}: tareas con antelación`, pend("antes"));
    add(at(-1, 19), `${l.icon} ${l.name}: lo del día antes y la maleta`, [...pend("dia"), ...l.sections.filter(s => s.kind === "pack").flatMap(s => s.items.filter(i => !i.d && i.imp).map(i => "⚠️ " + i.t))]);
    add(at(0, 7, 30), `${l.icon} ¡Hoy sales! Repasa antes de cerrar la puerta`, pend("salir"));
  } else {
    add(at(-1, 20), `${l.icon} Mañana: ${l.name}`, pend());
    add(at(0, 7, 30), `${l.icon} Hoy: ${l.name}`, pend().slice(0, 15));
  }
  if(!ev.length){ toast("La fecha ya ha pasado"); return; }
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Repaso//ES", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n");
  if(isIOS){ location.href = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
  a.download = `repaso-${norm(l.name).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")}.ics`; a.click();
  toast(`${ev.length} recordatorio${ev.length > 1 ? "s" : ""}: abre el archivo para añadirlos al calendario`);
}

  if(!SW) return; const t = e.touches[0], dx = t.clientX - SW.x, dy = t.clientY - SW.y;
  if(!SW.on){
    if(dx < -14 && Math.abs(dx) > Math.abs(dy) * 1.5){ SW.on = true;
      const bg = document.createElement("div"); bg.className = "swbg"; bg.textContent = "Quitar 🗑️";
      bg.style.top = SW.it.offsetTop + "px"; bg.style.height = SW.it.offsetHeight + "px"; bg.style.bottom = "auto";
      SW.it.parentNode.insertBefore(bg, SW.it); SW.bg = bg; SW.it.style.zIndex = 1; SW.it.style.transition = "none"; }
    else { if(Math.abs(dy) > 10) SW = null; return; }

let PR = [], pT = null, pSeq = 0;
function curQ(){ if(view.name !== "wizard") return null; const qs = vis(T[view.k], view.a); return qs[Math.min(view.step, qs.length)] || null; }
function placeInput(val){
  const a = view.a; a.lugar = val;
  if(a.place && a.place.name !== val){ a.place = null; a.wx = null; }
  clearTimeout(pT); const q = val.trim();
  if(q.length < 2){ PR = []; drawPR(); return; }
  const n = norm(q);
  const local = Object.entries(C).filter(([cc, c]) => norm(c[0]).startsWith(n)).slice(0, 3)
    .map(([cc, c]) => ({name:c[0], cc, sub:"País", lat:null, lon:null}));
  PR = local; drawPR();
  if(!navigator.onLine) return;
  const seq = ++pSeq;
  pT = setTimeout(async () => {
    try{
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=es&format=json`);
      const j = await r.json(); if(seq !== pSeq) return;
      const remote = (j.results || []).filter(x => x.country_code).map(x => ({name:x.name, cc:x.country_code.toUpperCase(), lat:x.latitude, lon:x.longitude,
        sub:[x.admin1, x.country].filter(Boolean).filter((v, i, arr) => arr.indexOf(v) === i).join(", ")}));
      const seen = new Set(); PR = [...remote, ...local].filter(p => { const k = p.name + p.cc; if(seen.has(k)) return false; seen.add(k); return true; }).slice(0, 6);
      drawPR();
    }catch(e){}
  }, 300);
}
function drawPR(){
  const el = $("#pres"); if(!el) return;
  const flag = cc => cc && cc.length === 2 ? String.fromCodePoint(...[...cc].map(c => 127397 + c.charCodeAt(0))) : "📍";
  el.innerHTML = PR.map((p, i) => `<button class="op" data-act="pick" data-v="${i}"><span class="em">${flag(p.cc)}</span><span><b>${esc(p.name)}</b><small>${esc(p.sub)}</small></span></button>`).join("");

function pickPlace(p){
  const a = view.a; a.place = p; a.lugar = p.name; PR = [];
  const k = country(p.cc);
  if(k){ a.destino = destOf(k); a.divisa = !!k.cur; } else { a.destino = "fuera"; a.divisa = true; }
  fetchWx(a);
}

/* ===================== Acciones ===================== */
const L_ = () => getList(view.id);
const secOf = id => L_().sections.find(s => s.id === id);
const ICONS = ["✈️","🧳","🏠","🏋️","🏃","🤸","💼","🏖️","⛷️","🥾","🚗","🚆","🎒","🛒","👶","🐶","🎉","📋","🏕️","🎓","🏥","🎸","⚽","🧘"];
const ACT = {
  tab(el){ go({name:el.dataset.v}, true); },
  hf(el){ view.f = el.dataset.v; history.replaceState(view, ""); render(); },
  new(){ openSheet(`<h2>Nueva lista</h2><p>¿Para qué es?</p><div class="grid">` + Object.entries(T).map(([k, t]) =>
      `<button class="card tile" data-act="tpl" data-k="${k}"><span class="em">${t.icon}</span><b>${t.name}</b><small>${t.desc}</small></button>`).join("") +
      `<button class="card tile" data-act="blank"><span class="em">✏️</span><b>Lista vacía</b><small>Empieza de cero</small></button></div>` +
      (S.templates.length ? `<div class="h2">Mis plantillas</div><div class="card">` + S.templates.map(t => `<button class="row" data-act="mytpl" data-id="${t.id}"><span class="em">${esc(t.icon)}</span><span class="tx"><b>${esc(t.name)}</b></span><span class="go">›</span></button>`).join("") + `</div>` : "")); },
  close(){ closeSheet(); },
  tpl(el){ closeSheet(); go({name:"wizard", k:el.dataset.k, a:defaults(el.dataset.k), step:0}); },
  blank(){ closeSheet(); const l = makeList("Mi lista", "📋", [{title:"📋 General", items:[]}]); S.lists.push(l); save(); go({name:"list", id:l.id}); ui.edit = true; render(); toast("Ponle nombre y escribe lo que necesites"); },
  mytpl(el){ closeSheet(); const t = S.templates.find(t => t.id === el.dataset.id); const l = makeList(t.name, t.icon, t.sections); S.lists.push(l); save(); go({name:"list", id:l.id}); },
  deltpl(el){ const b = snap(); S.templates = S.templates.filter(t => t.id !== el.dataset.id); save(); render(); toast("Plantilla borrada", [["Deshacer", () => restore(b)]]); },
  learned(el){ const k = el.dataset.k, L = learnOf(k);
    const adds = Object.entries(L.add).flatMap(([s, its]) => its.map(t => [s, t]));
    openSheet(`<h2>${T[k].icon} ${T[k].name}</h2><p>Esto es lo que tengo en cuenta al crear tus listas de ${T[k].name.toLowerCase()}.</p>
      <div class="h2">Añado siempre (${adds.length})</div><div class="card">${adds.length ? adds.map(([s, t]) => `<div class="row"><span class="tx"><b style="font-weight:500">${esc(t)}</b><small>${esc(s)}</small></span><button class="del" data-act="unlearn" data-k="${k}" data-s="${esc(s)}" data-v="${esc(t)}">✕</button></div>`).join("") : `<p class="hint" style="padding:12px">Nada todavía.</p>`}</div>
      <div class="h2">No vuelvo a sugerir (${L.hide.length})</div><div class="card">${L.hide.length ? L.hide.map(t => `<div class="row"><span class="tx"><b style="font-weight:500">${esc(t)}</b></span><button class="chip" data-act="unhide" data-k="${k}" data-v="${esc(t)}">Recuperar</button></div>`).join("") : `<p class="hint" style="padding:12px">Nada todavía.</p>`}</div>`); },
  unlearn(el){ const L = learnOf(el.dataset.k); const s = el.dataset.s; L.add[s] = (L.add[s] || []).filter(t => t !== el.dataset.v); if(!L.add[s].length) delete L.add[s]; save(); ACT.learned(el); render(); },
  unhide(el){ const L = learnOf(el.dataset.k); L.hide = L.hide.filter(t => t !== el.dataset.v); save(); ACT.learned(el); render(); },
  /* asistente */
  ans(el){ const t = T[view.k], q = t.qs.find(q => q.id === el.dataset.q), a = view.a, v = el.dataset.v;
    if(q.type === "multi"){ a[q.id] = has(a[q.id], v) ? a[q.id].filter(z => z !== v) : [...(a[q.id] || []), v]; render(); return; }
    if(q.type === "toggle") a[q.id] = v === "1"; else { a[q.id] = v; t.onSet && t.onSet(a, q.id, v); }
    const red = t.redirect && t.redirect(a);
    if(red){ const k = red.k, na = {...defaults(k), ...red.preset}; if(T[k].onSet) Object.entries(red.preset).forEach(([i, val]) => T[k].onSet(na, i, val));
      render(); setTimeout(() => { view = {name:"wizard", k, a:na, step:0}; history.replaceState(view, ""); render(); scrollTo(0, 0);
        toast(red.preset.motivo === "curso" ? "Te llevo al asistente de viajes, ya en modo curso" : "Te llevo al asistente de viajes, ya en modo trabajo"); }, 230); return; }
    render(); const st = view.step; setTimeout(() => { if(view.name === "wizard" && view.step === st){ view.step = view.back ?? st + 1; view.back = null; render(); scrollTo(0, 0); } }, 230); },
  num(el){ setNum(el.dataset.q, (view.a[el.dataset.q] | 0) + (+el.dataset.v)); },
  numset(el){ setNum(el.dataset.q, +el.dataset.v); },
  pick(el){ pickPlace(PR[+el.dataset.v]); ACT.wnext(); },
  wnext(){
    const q = curQ(), a = view.a;
    if(q && q.type === "place" && !a.place && a.lugar && a.lugar.trim()){
      const m = PR.find(p => norm(p.name) === norm(a.lugar)) || (PR.length === 1 ? PR[0] : null);
      if(m) pickPlace(m);
    }
    fetchWx(view.a); view.step = view.back ?? view.step + 1; view.back = null; render(); scrollTo(0, 0); },
  wback(){ if(view.step > 0){ view.step = Math.min(view.step, vis(T[view.k], view.a).length) - 1; view.back = null; render(); } else ACT.wclose(); },
  wclose(){ if(history.length > 1 && history.state && history.state.name === "wizard"){ leaving = true; history.back(); } else go({name:"home"}, true); },
  wjump(el){ view.back = vis(T[view.k], view.a).length; view.step = +el.dataset.v; render(); scrollTo(0, 0); },
  create(){ const t = T[view.k]; const secs = generate(view.k, view.a);
    const l = makeList((view.lname ?? t.title(view.a)).trim() || t.title(view.a), t.icon, secs, {tpl:view.k, date:view.a.fecha || null});
    S.lists.push(l); save();
    view = {name:"list", id:l.id}; ui = {edit:false, hide:false, imp:false, col:{}, sug:null}; history.replaceState(view, ""); render(); scrollTo(0, 0); },
  /* lista */
  back(){ if(ui.edit) ACT.edit(); if(history.length > 1 && history.state && history.state.name === "list"){ leaving = true; history.back(); } else go({name:"home"}, true); },
  open(el){ go({name:"list", id:el.dataset.id}); },
  lf(el){ view.f = el.dataset.v; history.replaceState(view, ""); render(); },
  tipok(){ S.seen.listTip = true; save(); render(); },
  col(el){ const s = secOf(el.dataset.s); const n = s.items.length, dn = s.items.filter(i => i.d).length;
    const cur = ui.col[s.id] ?? (n > 0 && dn === n); ui.col[s.id] = !cur; render(); },
  tog(el){ const l = L_(); const s = secOf(el.dataset.s), i = s.items.find(i => i.id === el.dataset.i);
    i.d = !i.d; save();
    if(i.d && s.items.every(x => x.d)) ui.col[s.id] = undefined;
    render(); if(navigator.vibrate && i.d) navigator.vibrate(8);
    const c = count(l); if(i.d && c.d === c.n) confetti(); },
  delit(el){ const b = snap(), l = L_(), s = secOf(el.dataset.s), it = s.items.find(i => i.id === el.dataset.i);
    s.items = s.items.filter(i => i.id !== el.dataset.i); save(); render();
    const acts = [["Deshacer", () => restore(b)]];
    if(l.tpl && T[l.tpl] && !ui.edit) acts.push(["No sugerir más", () => { const L = learnOf(l.tpl); if(!L.hide.includes(it.t)) L.hide.push(it.t);
      Object.keys(L.add).forEach(k => L.add[k] = L.add[k].filter(t => t !== it.t)); save(); toast(`No volverá a salir en tus listas de ${T[l.tpl].name.toLowerCase()}`); }]);
    toast(`Quitado: ${it.t}`, acts); },
  delsec(el){ const b = snap(), l = L_(); const s = secOf(el.dataset.s);
    l.sections = l.sections.filter(x => x.id !== s.id); save(); render(); toast(`Sección «${s.title}» borrada`, [["Deshacer", () => restore(b)]]); },
  star(el){ const i = secOf(el.dataset.s).items.find(i => i.id === el.dataset.i); i.imp = !i.imp; save(); render(); },
  move(el){ const s = secOf(el.dataset.s), k = s.items.findIndex(i => i.id === el.dataset.i), j = k + (+el.dataset.v);
    if(j < 0 || j >= s.items.length) return; [s.items[k], s.items[j]] = [s.items[j], s.items[k]]; save(); render(); },
  smove(el){ const l = L_(), k = l.sections.findIndex(s => s.id === el.dataset.s), j = k + (+el.dataset.v);
    if(j < 0 || j >= l.sections.length) return; [l.sections[k], l.sections[j]] = [l.sections[j], l.sections[k]]; save(); render(); },
  kind(el){ const s = secOf(el.dataset.s); s.kind = s.kind === "do" ? "pack" : "do"; save(); render(); toast(s.kind === "do" ? "Ahora es una sección «Por hacer»" : "Ahora es una sección «Para llevar»"); },
  edit(){ ui.edit = !ui.edit; ui.sug = null;
    if(!ui.edit){ const l = L_(); l.name = (l.name || "").trim() || "Mi lista";
      l.sections.forEach(s => { s.title = (s.title || "").trim() || "Sin título"; s.items = s.items.filter(i => (i.t = (i.t || "").trim())); }); save(); }
    render(); if(!ui.edit) toast("Cambios guardados"); },
  hide(){ ui.hide = !ui.hide; closeSheet(); render(); },
  fimp(){ ui.imp = !ui.imp; render(); },
  sug(el){ ui.sug = ui.sug === el.dataset.s ? null : el.dataset.s; render(); },
  addsug(el){ addItem(el.dataset.s, el.dataset.v, true); },
  icon(){ const l = L_(); openSheet(`<h2>Elige un icono</h2><div class="emojis">${ICONS.map(e => `<button class="${e === l.icon ? "on" : ""}" data-act="seticon" data-v="${e}">${e}</button>`).join("")}</div>`); },
  seticon(el){ L_().icon = el.dataset.v; save(); closeSheet(); render(); },
  menu(){ const l = L_();
    openSheet(`<h2>${esc(l.icon)} ${esc(l.name)}</h2><p>${count(l).n} cosas${l.date ? " · " + whenTxt(daysTo(l.date)).toLowerCase() : ""}</p>
      <button class="mi" data-act="reset">🔄<span>Desmarcar todo<small>Para volver a usarla (la mochila de cada día)</small></span></button>
      <button class="mi" data-act="datesheet">📅<span>${l.date ? "Cambiar la fecha" : "Poner fecha de salida"}<small>Verás la cuenta atrás</small></span></button>
      <button class="mi" data-act="ics">🔔<span>Recordatorios en el calendario<small>${l.date ? "Avisos antes de salir, con las tareas de cada momento" : "Primero pon la fecha de salida"}</small></span></button>
      <button class="mi" data-act="savetpl">⭐<span>Guardar como mi plantilla<small>Para crearla igual en un toque</small></span></button>
      <button class="mi" data-act="sharetxt">💬<span>Compartir como texto<small>WhatsApp, notas, correo…</small></span></button>
      <button class="mi" data-act="sharelink">🔗<span>Enviar enlace<small>La otra persona la importa en su Repaso</small></span></button>
      <button class="mi" data-act="dup">📄<span>Duplicar</span></button>
      <button class="mi" data-act="collapseall">↕️<span>Plegar o desplegar todas las secciones</span></button>
      <button class="mi red" data-act="dellist">🗑️<span>Borrar lista</span></button>`); },
  datesheet(){ const l = L_(); openSheet(`<h2>📅 Fecha de salida</h2><p>Aparecerá la cuenta atrás en la lista y en el inicio.</p>
      <input class="inp big-inp" type="date" id="dt" value="${esc(l.date || "")}"><div style="height:12px"></div>
      <button class="btn" data-act="setdate">Guardar</button>${l.date ? `<div style="height:8px"></div><button class="btn sec" data-act="nodate">Quitar fecha</button>` : ""}`); },
  setdate(){ L_().date = $("#dt").value || null; save(); closeSheet(); render(); },
  nodate(){ L_().date = null; save(); closeSheet(); render(); },
  collapseall(){ const l = L_(); const anyOpen = l.sections.some(s => !(ui.col[s.id] ?? (s.items.length && s.items.every(i => i.d))));
    l.sections.forEach(s => ui.col[s.id] = anyOpen); closeSheet(); render(); },
  reuse(el){ const l = getList(el.dataset.id); l.sections.forEach(s => s.items.forEach(i => i.d = false)); l.created = Date.now(); ui.col = {}; save(); view.f = "act"; go({name:"list", id:l.id}); toast("Desmarcada. ¡A repasar otra vez!"); },
  ics(){ const l = L_(); if(!l.date){ ACT.datesheet(); return; } closeSheet(); downloadICS(l); },
  reset(){ const b = snap(); L_().sections.forEach(s => s.items.forEach(i => i.d = false)); ui.col = {}; save(); closeSheet(); render(); toast("Lista desmarcada, lista para usar", [["Deshacer", () => restore(b)]]); },
  savetpl(){ const l = L_(); S.templates.push({id:uid(), name:l.name, icon:l.icon, sections:plain(l)}); save(); closeSheet(); toast("Guardada en Plantillas → Mis plantillas"); },
  sharetxt(){ const l = L_(); closeSheet(); shareOrCopy(l.name, asText(l)); },
  sharelink(){ const l = L_(); closeSheet(); shareOrCopy(l.name, `Te paso mi lista «${l.name}» para la app Repaso:\n${linkFor(l)}`); },
  dup(){ const l = L_(); const n = makeList(l.name + " (copia)", l.icon, plain(l), {tpl:l.tpl, date:l.date}); S.lists.push(n); save(); closeSheet(); go({name:"list", id:n.id}, true); toast("Lista duplicada"); },
  dellist(){ const b = snap(); const l = L_(); S.lists = S.lists.filter(x => x.id !== l.id); save(); closeSheet(); go({name:"home"}, true); toast(`«${l.name}» borrada`, [["Deshacer", () => restore(b)]]); },
  /* ayuda */
  tutorial(){ tutorial(); },
  learnset(){ S.settings.learn = !S.settings.learn; save(); render(); },
  async install(){ if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; render(); },
  export(){ const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"}); const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `repaso-copia-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast("Copia descargada"); },
  wipe(){ openSheet(`<h2>¿Borrar todo?</h2><p>Se borrarán tus ${S.lists.length} listas, tus plantillas y lo aprendido. No se puede deshacer.</p><button class="btn" style="background:var(--warn)" data-act="wipeok">Sí, borrar todo</button><div style="height:8px"></div><button class="btn sec" data-act="close">Cancelar</button>`); },
  wipeok(){ S = DEF(); S.seen.tutorial = true; save(); closeSheet(); go({name:"home"}, true); toast("Datos borrados"); }
};

function addItem(sid, text, fromSug){
  const l = L_(), s = secOf(sid); const t = text.trim(); if(!t) return;
  if(s.items.some(i => i.t.toLowerCase() === t.toLowerCase())){ toast("Eso ya está en la lista"); return; }
  const it = {id:uid(), t, d:false}; s.items.push(it); save();
  if(fromSug && suggestionsFor(l, s).length === 0) ui.sug = null;
  render();
  if(!fromSug){ const inp = document.querySelector(`form[data-s="${sid}"] input`); if(inp) inp.focus(); }
  if(l.tpl && T[l.tpl] && S.settings.learn){
    const L = learnOf(l.tpl); L.hide = L.hide.filter(x => x !== t);
    const inGen = (catalog().get(s.title) || new Set()).has(t);
    if(!inGen){ L.add[s.title] = L.add[s.title] || []; if(!L.add[s.title].includes(t)) L.add[s.title].push(t); save();
      toast(`Añadido. Lo recordaré en tus listas de ${T[l.tpl].name.toLowerCase()}`, [["No recordar", () => { L.add[s.title] = L.add[s.title].filter(x => x !== t); if(!L.add[s.title].length) delete L.add[s.title]; save(); }]]); }
  }
}
function importFile(e){
  const file = e.target.files[0]; if(!file) return; const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(!Array.isArray(d.lists)) throw 0;
      const have = new Set(S.lists.map(l => l.id)); let n = 0;
      d.lists.forEach(l => { if(!have.has(l.id)){ l.sections.forEach(s => s.kind = s.kind || "pack"); S.lists.push(l); n++; } });
      const ht = new Set(S.templates.map(t => t.id)); (d.templates || []).forEach(t => { if(!ht.has(t.id)) S.templates.push(t); });
      Object.entries(d.learn || {}).forEach(([k, L]) => { const M = learnOf(k); M.hide = [...new Set([...M.hide, ...(L.hide || [])])];
        Object.entries(L.add || {}).forEach(([s, its]) => M.add[s] = [...new Set([...(M.add[s] || []), ...its])]); });
      save(); render(); toast(`${n} listas recuperadas`);
    }catch(err){ toast("Ese archivo no es una copia válida"); } };
  r.readAsText(file);
}

document.addEventListener("click", e => { if(Date.now() - swiped < 350){ e.preventDefault(); return; } const t = e.target.closest("[data-act]"); if(!t || t.disabled) return; const f = ACT[t.dataset.act]; if(f){ e.preventDefault(); f(t, e); } });
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault(); const v = (f.t ? f.t.value : "").trim(); if(!v) return;
  if(f.dataset.form === "add") addItem(f.dataset.s, v);
  if(f.dataset.form === "addsec"){ const l = L_(); const s = {id:uid(), title:v, kind:view.f === "do" ? "do" : "pack", items:[]}; l.sections.push(s); save(); render();
    const inp = document.querySelector(`form[data-s="${s.id}"] input`); if(inp){ inp.focus(); inp.scrollIntoView({block:"center"}); } }
});
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.dataset && e.target.dataset.in === "place"){ e.preventDefault(); e.target.blur(); if(PR.length && !view.a.place) pickPlace(PR[0]); ACT.wnext(); return; }
  if(e.key === "Enter" && e.target.dataset && e.target.dataset.in === "ans"){ e.preventDefault(); e.target.blur(); ACT.wnext(); }
});
document.addEventListener("change", e => { if(e.target.id === "impf") importFile(e); });
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset.in; if(!k) return;
  if(k === "place"){ placeInput(el.value); const b = $(".bottom .btn"); if(b){ b.textContent = el.value ? "Siguiente" : "Saltar"; b.classList.remove("sec"); } return; }
  if(k === "ans"){ view.a[el.dataset.q] = el.value; if(el.type === "date") fetchWx(view.a);
    const b = $(".bottom .btn"); if(b){ const q = T[view.k].qs.find(q => q.id === el.dataset.q); b.textContent = q.optional && !el.value ? "Saltar" : "Siguiente"; b.classList.remove("sec"); } return; }
  if(k === "wname"){ view.lname = el.value; return; }
  const l = L_(); if(!l) return;
  if(k === "lname") l.name = el.value;
  if(k === "stitle") secOf(el.dataset.s).title = el.value;
  if(k === "itext") secOf(el.dataset.s).items.find(i => i.id === el.dataset.i).t = el.value;
  save();
});

/* ===================== Arranque ===================== */
history.replaceState(view, "");
render();
const imported = checkImport();
if(!S.seen.tutorial && !imported) tutorial();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
