<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso · que no se te olvide nada</title>
<meta name="description" content="Listas para repasar antes de un viaje, de salir de casa o de ir a entrenar.">
<meta name="theme-color" content="#127c6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Repaso">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f4ef;--card:#fff;--ink:#1d2a2a;--muted:#6b7676;--line:#e7e3da;
  --accent:#127c6e;--accent-ink:#fff;--soft:#dcefeb;--danger:#c2410c;--done:#a3acaa;
  --r:16px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111615;--card:#1a2120;--ink:#e9efed;--muted:#95a3a0;--line:#2a3331;
  --accent:#3fbfa9;--accent-ink:#0b1a17;--soft:#1f3a35;--danger:#fb923c;--done:#5f6b69;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px}
.top h1{font-size:22px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{font-size:13px;color:var(--muted);margin:0}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.ib:active{background:var(--line)}
.ib.on{background:var(--soft);color:var(--accent)}
.wrap{padding:0 16px}
.hero{padding:6px 16px 4px}
.hero h1{font-size:30px;margin:0 0 2px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.lc{display:flex;align-items:center;gap:12px;padding:14px;margin:10px 0;width:100%;text-align:left}
.lc .em{font-size:28px;width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.lc .tx{flex:1;min-width:0}
.lc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc small{color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .25s}
.h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 6px;font-weight:600}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--accent);color:var(--accent-ink);padding:15px 26px;border-radius:99px;font-weight:700;box-shadow:0 6px 20px rgba(18,124,110,.35);z-index:6;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:104px;position:relative}
.tile .em{font-size:28px}
.tile b{font-size:15px}
.tile small{color:var(--muted);font-size:12.5px;line-height:1.3}
.tile .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:9px;color:var(--muted)}
.empty{text-align:center;padding:26px 16px 6px;color:var(--muted)}
.empty .big{font-size:52px}
/* wizard */
.q{padding:14px;margin:10px 0}
.q label,.q .ql{display:block;font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--bg);font-size:15px}
.chip.on{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600}
.step{display:flex;align-items:center;gap:16px}
.step button{width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);font-size:22px;background:var(--bg)}
.step output{font-size:26px;font-weight:700;min-width:40px;text-align:center}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:none}
.inp:focus{border-color:var(--accent)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-align:center;margin:16px 0}
.btn.sec{background:var(--soft);color:var(--accent)}
/* list */
.prog{padding:0 16px 6px}
.prog .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.sec{margin:12px 16px;overflow:hidden}
.sh{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.sh h3{margin:0;font-size:16px;flex:1}
.sh .ct{font-size:13px;color:var(--muted)}
.it{display:flex;align-items:center;gap:4px;padding:2px 6px 2px 14px;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.chk{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:11px 0;text-align:left}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;transition:.15s}
.it.d .box{background:var(--accent);border-color:var(--accent)}
.it.d .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.it.d .t{color:var(--done);text-decoration:line-through}
.t{word-break:break-word}
.del{width:36px;height:36px;border-radius:10px;color:var(--muted);font-size:18px;flex:none;opacity:.6}
.del:active{background:var(--line);opacity:1}
.it .inp{padding:8px 10px;margin:6px 0}
.add{display:flex;gap:8px;padding:8px 10px 10px 14px;border-top:1px solid var(--line)}
.add input{flex:1;border:0;background:transparent;outline:none;padding:8px 0}
.add input::placeholder{color:var(--muted)}
.add button{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--accent);font-size:22px;font-weight:700}
.party{margin:12px 16px;padding:16px;text-align:center;background:var(--soft);color:var(--accent);border-radius:var(--r);font-weight:700}
.hint{font-size:13px;color:var(--muted);padding:4px 20px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{margin:4px 0 12px;font-size:20px}
.mi{display:flex;gap:12px;align-items:center;width:100%;padding:14px;text-align:left;border-radius:12px;font-size:16px}
.mi:active{background:var(--line)}
.mi.red{color:var(--danger)}
.sheet p{color:var(--muted);margin:6px 0}
.sheet ol{padding-left:20px;margin:6px 0 14px}
.sheet li{margin:4px 0}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;display:flex;gap:16px;align-items:center;z-index:30;width:max-content;max-width:92%;font-size:15px;animation:fd .2s}
.toast button{color:var(--accent);font-weight:700;filter:brightness(1.4)}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "repaso.v1";
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.lists) return {templates:[], ...d}; }catch(e){} return {lists:[], templates:[]}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("No se ha podido guardar"); } }
let S = load();

/* Constructor de listas: evita duplicados */
function B(){
  const secs = []; let cur = null; const seen = new Set();
  return {
    sec(t){ cur = secs.find(s => s.title === t); if(!cur){ cur = {title:t, items:[]}; secs.push(cur); } return this; },
    add(text, cond = true){ if(cond && text && !seen.has(text)){ seen.add(text); cur.items.push(text); } return this; },
    done(){ return secs.filter(s => s.items.length); }
  };
}
const x = (t, n) => n > 1 ? `${t} ×${n}` : t;
const has = (arr, v) => (arr || []).includes(v);

/* ============ Reglas: maleta ============ */
function packing(b, a, opt = {}){
  const n = Math.max(1, a.dias | 0);
  const lav = a.lavadora && n > 5;
  const c = lav ? Math.min(n, 5) : n;
  const est = a.estacion, act = a.actividades || [];
  const calor = est === "verano", frio = est === "invierno", templ = est === "entretiempo";
  const agua = has(act,"playa") || has(act,"piscina");
  const sol = calor || agua || has(act,"nieve") || has(act,"montana");

  b.sec("👕 Ropa")
    .add(x("Ropa interior", c + 1))
    .add(x("Calcetines", c + 1))
    .add(x("Camisetas", c))
    .add(x("Pantalones largos", Math.max(1, Math.ceil(c / (calor ? 4 : 3)))))
    .add(x("Pantalones cortos", Math.max(1, Math.ceil(c / 3))), calor)
    .add(x("Pijama", n > 4 ? 2 : 1))
    .add("Calzado cómodo para caminar")
    .add(x("Sudadera o jersey", n > 4 ? 2 : 1), !calor)
    .add("Chaqueta ligera", templ || calor)
    .add("Abrigo", frio)
    .add("Gorro, guantes y bufanda", frio)
    .add("Camiseta térmica", frio)
    .add("Chubasquero o paraguas plegable", a.lluvia || templ)
    .add("Bolsa para la ropa sucia", n > 1)
    .add("Detergente de viaje", lav);

  if(agua) b.sec("🏖️ Playa y piscina")
    .add(x("Bañador", n > 2 ? 2 : 1)).add("Toalla de playa").add("Chanclas")
    .add("Gorra o sombrero").add("After sun").add("Funda estanca para el móvil", has(act,"playa"));
  if(has(act,"montana")) b.sec("🥾 Montaña")
    .add("Botas o zapatillas de montaña").add("Mochila pequeña de día").add("Cantimplora")
    .add("Cortavientos").add("Frontal o linterna").add("Ruta o mapa descargado");
  if(has(act,"nieve")) b.sec("⛷️ Nieve")
    .add("Chaqueta y pantalón de esquí").add("Guantes impermeables").add("Gafas de ventisca")
    .add("Casco").add("Forfait").add("Calcetines térmicos").add("Cacao labial");
  if(has(act,"deporte")) b.sec("🏃 Deporte")
    .add("Ropa deportiva").add("Zapatillas de deporte").add("Botella reutilizable");
  if(has(act,"elegante")) b.sec("🍷 Para arreglarse")
    .add("Conjunto arreglado").add("Zapatos de vestir").add("Complementos");
  if(has(act,"trabajo")) b.sec("💼 Trabajo")
    .add("Portátil y cargador").add("Ropa formal").add("Documentación de las reuniones").add("Adaptador USB-C / HDMI");

  const liq = opt.mano;
  b.sec("🧴 Neceser")
    .add(liq ? "Líquidos en envases de 100 ml como máximo, en bolsa transparente" : null, liq)
    .add("Cepillo de dientes").add("Pasta de dientes").add("Desodorante")
    .add(liq ? "Champú y gel en envases de viaje" : "Champú y gel")
    .add("Peine o cepillo").add("Maquinilla de afeitar").add("Crema hidratante")
    .add("Protector solar", sol).add("Repelente de mosquitos", calor)
    .add("Gafas o lentillas (y líquido)").add("Productos de higiene íntima")
    .add("Medicación habitual").add("Mini botiquín: analgésico, tiritas, antidiarreico", n > 2);

  if(opt.tech !== false) b.sec("🔌 Tecnología")
    .add("Cargador del móvil").add("Batería externa").add("Auriculares");

  b.sec("🎒 Otros")
    .add("Gafas de sol", calor || sol).add("Bolsa plegable").add("Libro o e-reader", n > 1)
    .add("Botella reutilizable");
}

/* ============ Plantillas ============ */
const T = {
  viaje: {
    icon:"✈️", name:"Viaje", desc:"Documentación, roaming, transporte, maleta…",
    qs:[
      {id:"lugar", type:"text", label:"¿A dónde vas?", ph:"Ej.: Londres (opcional)"},
      {id:"destino", type:"choice", label:"Destino", def:"ue", opts:[["nacional","🇪🇸 España"],["ue","🇪🇺 Unión Europea"],["fuera","🌍 Fuera de la UE"]]},
      {id:"divisa", type:"toggle", label:"¿Usan otra moneda (no euro)?", def:false, show:a => a.destino !== "nacional"},
      {id:"transporte", type:"choice", label:"¿Cómo vas?", def:"avion", opts:[["avion","✈️ Avión"],["tren","🚆 Tren"],["coche","🚗 Coche"],["bus","🚌 Autobús"],["barco","⛴️ Barco"]]},
      {id:"equipaje", type:"choice", label:"Equipaje", def:"mano", opts:[["mano","Solo de mano"],["facturado","Facturado"]], show:a => a.transporte === "avion"},
      {id:"dias", type:"number", label:"¿Cuántos días?", def:3, min:1, max:60},
      {id:"estacion", type:"choice", label:"¿Qué tiempo esperas?", def:"entretiempo", opts:[["verano","☀️ Calor"],["entretiempo","🌤️ Templado"],["invierno","❄️ Frío"]]},
      {id:"lluvia", type:"toggle", label:"¿Puede llover?", def:false},
      {id:"actividades", type:"multi", label:"¿Qué vas a hacer?", def:["ciudad"], opts:[["ciudad","🏙️ Ciudad"],["playa","🏖️ Playa"],["piscina","🏊 Piscina"],["montana","🥾 Montaña"],["nieve","⛷️ Nieve"],["deporte","🏃 Deporte"],["elegante","🍷 Cena o evento"],["trabajo","💼 Trabajo"]]},
      {id:"con", type:"multi", label:"¿Viajas con…?", def:[], opts:[["ninos","👶 Niños"],["mascota","🐶 Mascota"]]},
      {id:"alquiler", type:"toggle", label:"¿Vas a alquilar coche?", def:false, show:a => a.transporte !== "coche"},
      {id:"lavadora", type:"toggle", label:"¿Podrás lavar ropa allí?", def:false, show:a => a.dias > 5},
      {id:"casa", type:"toggle", label:"¿Añadir el repaso de casa antes de salir?", def:true}
    ],
    onSet(a, id, v){ if(id === "destino") a.divisa = v === "fuera"; },
    title(a){ return `Viaje${a.lugar ? " a " + a.lugar.trim() : ""} · ${a.dias} ${a.dias == 1 ? "día" : "días"}`; },
    build(a){
      const b = B();
      const fuera = a.destino === "fuera", ue = a.destino === "ue", nac = a.destino === "nacional";
      const tr = a.transporte, avion = tr === "avion", coche = tr === "coche";
      const conduce = coche || a.alquiler;
      b.sec("🪪 Documentación")
        .add("DNI en vigor", !fuera)
        .add("Pasaporte en vigor (mejor con 6 meses de validez como mínimo)", fuera)
        .add("Comprobar si necesitas visado o autorización electrónica (ESTA, ETA…)", fuera)
        .add("Tarjeta Sanitaria Europea", ue)
        .add("Tarjeta sanitaria", nac)
        .add("Seguro de viaje con cobertura médica", fuera)
        .add("Tarjetas de embarque descargadas en el móvil", avion)
        .add("Billetes descargados", !avion && !coche)
        .add("Reserva del alojamiento")
        .add("Carnet de conducir", conduce)
        .add("Permiso internacional de conducir (si lo exige el país)", fuera && conduce)
        .add("Reserva del coche de alquiler (y tarjeta de crédito para la fianza)", a.alquiler)
        .add("Documentación y seguro del coche", coche)
        .add("Fotos o copias de los documentos en la nube");
      b.sec("💳 Dinero")
        .add("Tarjeta de débito o crédito")
        .add("Tarjeta de reserva, guardada aparte")
        .add("Activar pagos en el extranjero en la app del banco", !nac)
        .add("Tarjeta sin comisión por cambio de divisa", a.divisa)
        .add("Algo de efectivo en moneda local", a.divisa)
        .add("Algo de efectivo", !a.divisa);
      b.sec("📱 Móvil y datos")
        .add("Roaming activado (en la UE pagas como en casa)", ue)
        .add("Revisar el límite de datos en roaming de tu tarifa", ue)
        .add("Contratar bono de roaming, eSIM o SIM local", fuera)
        .add("Si no tienes bono: desactivar los datos en roaming", fuera)
        .add("Ojo: Reino Unido, Suiza o Andorra no son UE y el roaming se suele cobrar", fuera)
        .add("Adaptador de enchufe (comprueba el tipo del país)", fuera || (ue && a.lugar && /irlanda|malta|chipre/i.test(a.lugar)))
        .add("Cargador del móvil").add("Batería externa").add("Auriculares")
        .add("Mapas sin conexión descargados")
        .add("App de la aerolínea o del transporte", !coche);
      if(avion) b.sec("✈️ Avión")
        .add("Check-in online hecho")
        .add("Comprobar medidas y peso del equipaje de mano de tu aerolínea")
        .add("Líquidos: envases de 100 ml como máximo en bolsa transparente (comprueba las normas del aeropuerto)")
        .add("Batería externa y cigarrillo electrónico siempre en cabina")
        .add("Nada de objetos cortantes en el equipaje de mano")
        .add("Etiqueta con tu nombre en la maleta facturada", a.equipaje === "facturado")
        .add("Pesar la maleta facturada en casa", a.equipaje === "facturado")
        .add(fuera ? "Llegar al aeropuerto unas 3 h antes" : "Llegar al aeropuerto unas 2 h antes")
        .add("Cómo ir al aeropuerto (o reservar el parking)")
        .add("Botella vacía para rellenar después del control")
        .add("Almohada de viaje y antifaz", fuera);
      if(tr === "tren") b.sec("🚆 Tren")
        .add("Llegar unos 30 min antes (hay control de equipaje)")
        .add("Comida y agua para el trayecto")
        .add("Series o música descargadas");
      if(tr === "bus" || tr === "barco") b.sec(tr === "bus" ? "🚌 Autobús" : "⛴️ Barco")
        .add("Llegar con antelación a la estación o al puerto")
        .add("Pastillas para el mareo", tr === "barco")
        .add("Comida y agua para el trayecto")
        .add("Series o música descargadas");
      if(coche) b.sec("🚗 Coche")
        .add("Revisar neumáticos, aceite y líquidos")
        .add("ITV y seguro en vigor")
        .add("Baliza V16 y chaleco reflectante")
        .add("Depósito lleno o batería cargada")
        .add("Peajes y viñetas del país (Suiza, Austria…)", !nac)
        .add("Cargador de móvil para el coche")
        .add("Gafas de sol para conducir")
        .add("Música o pódcast descargados");
      if(has(a.con,"ninos")) b.sec("👶 Niños")
        .add(fuera ? "Pasaporte de los niños" : "DNI de los niños")
        .add("Autorización de viaje si no viajan con ambos padres", !nac)
        .add("Juegos y entretenimiento").add("Snacks y agua").add("Toallitas")
        .add("Silla de coche", conduce).add("Medicinas infantiles (antitérmico)");
      if(has(a.con,"mascota")) b.sec("🐶 Mascota")
        .add("Pasaporte europeo o cartilla de la mascota", !nac)
        .add("Cartilla de vacunas", nac)
        .add("Comprobar normas del transporte y del alojamiento")
        .add("Transportín").add("Comida, cuencos y correa").add("Bolsas para excrementos");
      b.sec("🏁 En destino")
        .add("Dirección y hora de entrada del alojamiento")
        .add("Cómo ir del aeropuerto o estación al alojamiento", !coche)
        .add("Teléfono de emergencias del país (112 en la UE)")
        .add("Registrarte en el Registro de Viajeros del Ministerio de Exteriores", fuera)
        .add("Consultar vacunas recomendadas para el país", fuera);
      if(a.equipaje === "mano" && avion) packing(b, a, {tech:false, mano:true});
      else packing(b, a, {tech:false});
      if(a.casa) houseItems(b, {duracion: a.dias > 6 ? "largo" : a.dias > 2 ? "semana" : "finde", extras:[]}, true);
      return b.done();
    }
  },

  maleta: {
    icon:"🧳", name:"Maleta", desc:"Ropa y neceser según días y tiempo",
    qs:[
      {id:"dias", type:"number", label:"¿Cuántos días?", def:3, min:1, max:60},
      {id:"estacion", type:"choice", label:"¿Qué tiempo esperas?", def:"entretiempo", opts:[["verano","☀️ Calor"],["entretiempo","🌤️ Templado"],["invierno","❄️ Frío"]]},
      {id:"lluvia", type:"toggle", label:"¿Puede llover?", def:false},

function qHTML(q, a){
  if(q.show && !q.show(a)) return "";
  const chip = (on, act, v, l) => `<button class="chip ${on ? "on" : ""}" data-act="${act}" data-q="${q.id}" data-v="${v}">${l}</button>`;
  let body = "";
  if(q.type === "choice") body = `<div class="chips">${q.opts.map(([v, l]) => chip(a[q.id] === v, "ans", v, l)).join("")}</div>`;
  if(q.type === "multi") body = `<div class="chips">${q.opts.map(([v, l]) => chip(has(a[q.id], v), "ans", v, l)).join("")}</div>`;
  if(q.type === "toggle") body = `<div class="chips">${chip(a[q.id], "ans", "1", "Sí")}${chip(!a[q.id], "ans", "0", "No")}</div>`;
  if(q.type === "number") body = `<div class="step"><button data-act="num" data-q="${q.id}" data-v="-1" aria-label="Menos">−</button><output>${a[q.id]}</output><button data-act="num" data-q="${q.id}" data-v="1" aria-label="Más">+</button></div>`;
  if(q.type === "text") body = `<input class="inp" data-in="ans" data-q="${q.id}" value="${esc(a[q.id] || "")}" placeholder="${esc(q.ph || "")}">`;
  return `<div class="card q"><span class="ql">${q.label}</span>${body}</div>`;
}

function openSheet(html){ closeSheet(); const o = document.createElement("div"); o.className = "ov"; o.id = "ov";

  o.addEventListener("click", e => { if(e.target === o) closeSheet(); }); document.body.appendChild(o); }

let tT;
function toast(msg, undo){ const old = $(".toast"); if(old) old.remove(); clearTimeout(tT);
  const d = document.createElement("div"); d.className = "toast"; d.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>Deshacer</button>' : ""}`;
  if(undo) d.querySelector("button").onclick = () => { undo(); d.remove(); };

/* ============ Compartir / importar ============ */
const b64e = s => { const b = new TextEncoder().encode(s); let r = ""; b.forEach(c => r += String.fromCharCode(c)); return btoa(r).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const b64d = s => { const r = atob(s.replace(/-/g,"+").replace(/_/g,"/")); return new TextDecoder().decode(Uint8Array.from(r, c => c.charCodeAt(0))); };
function asText(l){ return `${l.icon} ${l.name}\n\n` + l.sections.map(s => `${s.title}\n` + s.items.map(i => `${i.d ? "☑" : "☐"} ${i.t}`).join("\n")).join("\n\n"); }
async function shareOrCopy(title, text){
  if(navigator.share){ try{ await navigator.share({title, text}); return; }catch(e){ if(e.name === "AbortError") return; } }
  try{ await navigator.clipboard.writeText(text); toast("Copiado al portapapeles"); }catch(e){ toast("No se ha podido copiar"); }
}
function linkFor(l){ const data = {n:l.name, i:l.icon, s:l.sections.map(s => [s.title, s.items.map(i => i.t)])};
  return location.origin + location.pathname + "#import=" + b64e(JSON.stringify(data)); }
function checkImport(){
  const m = location.hash.match(/^#import=(.+)$/); if(!m) return;
  history.replaceState(view, "", location.pathname);
  try{ const d = JSON.parse(b64d(m[1])); const secs = d.s.map(([title, items]) => ({title, items}));
    openSheet(`<h2>${esc(d.i)} ${esc(d.n)}</h2><p>Te han compartido esta lista (${secs.reduce((n, s) => n + s.items.length, 0)} cosas). ¿La añades a tus listas?</p>
      <button class="btn" id="imp">Añadir a mis listas</button><button class="btn sec" data-act="close">Ahora no</button>`);
    $("#imp").onclick = () => { const l = makeList(d.n, d.i || "📋", secs); S.lists.push(l); save(); closeSheet(); go({name:"list", id:l.id}); };
  }catch(e){ toast("El enlace de la lista no es válido"); }
}

  tpl(el){ closeSheet(); const t = T[el.dataset.k]; const a = {};
    t.qs.forEach(q => a[q.id] = Array.isArray(q.def) ? [...q.def] : q.def);
    go({name:"wizard", k:el.dataset.k, a}); },
  blank(){ closeSheet(); const l = makeList("Mi lista", "📋", [{title:"📋 General", items:[]}]); S.lists.push(l); save(); go({name:"list", id:l.id}); ui.edit = true; render(); },
  mytpl(el){ closeSheet(); const t = S.templates.find(t => t.id === el.dataset.id); const l = makeList(t.name, t.icon, t.sections); S.lists.push(l); save(); go({name:"list", id:l.id}); },
  deltpl(el){ const b = snap(); S.templates = S.templates.filter(t => t.id !== el.dataset.id); save(); ACT.new(); toast("Plantilla borrada", () => { restore(b); ACT.new(); }); },
  ans(el){ const t = T[view.k], q = t.qs.find(q => q.id === el.dataset.q), a = view.a, v = el.dataset.v;
    if(q.type === "multi"){ a[q.id] = has(a[q.id], v) ? a[q.id].filter(z => z !== v) : [...(a[q.id] || []), v]; }
    else if(q.type === "toggle") a[q.id] = v === "1";
    else { a[q.id] = v; t.onSet && t.onSet(a, q.id, v); }
    history.replaceState(view, ""); render(); },
  num(el){ const q = T[view.k].qs.find(q => q.id === el.dataset.q); const a = view.a;
    a[q.id] = Math.min(q.max, Math.max(q.min, (a[q.id] | 0) + (+el.dataset.v))); history.replaceState(view, ""); render(); },
  create(){ const t = T[view.k]; const secs = t.build(view.a);
    const l = makeList(t.title(view.a), t.icon, secs); S.lists.push(l); save();
    view = {name:"list", id:l.id}; ui.edit = false; ui.hide = false; history.replaceState(view, ""); render(); scrollTo(0, 0); },
  back(){ history.length > 1 && history.state && history.state.name !== "home" ? history.back() : go({name:"home"}, true); },
  open(el){ go({name:"list", id:el.dataset.id}); },
  tog(el){ const l = getList(view.id); const i = l.sections.find(s => s.id === el.dataset.s).items.find(i => i.id === el.dataset.i);
    i.d = !i.d; save(); render(); if(navigator.vibrate && i.d) navigator.vibrate(8); },
  delit(el){ const b = snap(); const s = getList(view.id).sections.find(s => s.id === el.dataset.s); const it = s.items.find(i => i.id === el.dataset.i);
    s.items = s.items.filter(i => i.id !== el.dataset.i); save(); render(); toast(`Quitado: ${it.t}`, () => restore(b)); },
  delsec(el){ const b = snap(); const l = getList(view.id); l.sections = l.sections.filter(s => s.id !== el.dataset.s); save(); render(); toast("Sección borrada", () => restore(b)); },
  edit(){ ui.edit = !ui.edit; render(); },
  hide(el, e){ e && e.preventDefault(); ui.hide = !ui.hide; closeSheet(); render(); },
  menu(){ const l = getList(view.id); const c = count(l);
    openSheet(`<h2>${esc(l.name)}</h2>
      <button class="mi" data-act="reset">🔄 Desmarcar todo (para volver a usarla)</button>
      <button class="mi" data-act="hide">${ui.hide ? "👁️ Mostrar los marcados" : "🙈 Ocultar los marcados"}</button>
      <button class="mi" data-act="savetpl">⭐ Guardar como mi plantilla</button>
      <button class="mi" data-act="sharetxt">💬 Compartir como texto</button>
      <button class="mi" data-act="sharelink">🔗 Enviar enlace para importarla</button>
      <button class="mi" data-act="dup">📄 Duplicar</button>
      <button class="mi red" data-act="dellist">🗑️ Borrar lista</button>`); },
  reset(){ const b = snap(); getList(view.id).sections.forEach(s => s.items.forEach(i => i.d = false)); save(); closeSheet(); render(); toast("Lista desmarcada", () => restore(b)); },
  savetpl(){ const l = getList(view.id); S.templates.push({id:uid(), name:l.name, icon:l.icon, sections:plain(l)}); save(); closeSheet(); toast("Guardada en «Mis plantillas»"); },
  sharetxt(){ const l = getList(view.id); closeSheet(); shareOrCopy(l.name, asText(l)); },
  sharelink(){ const l = getList(view.id); closeSheet(); shareOrCopy(l.name, `Te paso mi lista «${l.name}» para la app Repaso:\n${linkFor(l)}`); },
  dup(){ const l = getList(view.id); const n = makeList(l.name + " (copia)", l.icon, plain(l)); S.lists.push(n); save(); closeSheet(); go({name:"list", id:n.id}, true); toast("Lista duplicada"); },
  dellist(){ const b = snap(); S.lists = S.lists.filter(x => x.id !== view.id); save(); closeSheet(); go({name:"home"}, true); toast("Lista borrada", () => restore(b)); },
  info(){
    let inst = "";
    if(!standalone){
      inst = isIOS ? `<h2>📲 Instalar en iPhone</h2><ol><li>Abre esta página en <b>Safari</b>.</li><li>Pulsa el botón <b>Compartir</b> (cuadrado con flecha).</li><li>Elige <b>Añadir a pantalla de inicio</b>.</li></ol>`
        : installEvt ? `<h2>📲 Instalar</h2><button class="btn" data-act="install">Instalar la app</button>`
        : `<h2>📲 Instalar en Android</h2><ol><li>Abre esta página en <b>Chrome</b>.</li><li>Menú <b>⋮</b> → <b>Instalar aplicación</b> (o «Añadir a pantalla de inicio»).</li></ol>`;
    }
    openSheet(`${inst}<h2>💾 Copia de seguridad</h2><p>Tus listas se guardan solo en este móvil. Haz una copia de vez en cuando o para pasarlas a otro móvil.</p>
      <button class="mi" data-act="export">⬇️ Descargar copia</button>
      <label class="mi" style="cursor:pointer">⬆️ Restaurar copia<input type="file" accept=".json,application/json" id="impf" hidden></label>
      <p style="margin-top:16px;font-size:13px">Repaso · ${S.lists.length} listas · ${S.templates.length} plantillas propias</p>`);
    const f = $("#impf"); if(f) f.onchange = importFile;
  },
  async install(){ if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; closeSheet(); },
  export(){ const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"}); const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `repaso-copia-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
};
function importFile(e){
  const file = e.target.files[0]; if(!file) return; const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result); if(!Array.isArray(d.lists)) throw 0;
      const have = new Set(S.lists.map(l => l.id)); let n = 0;
      d.lists.forEach(l => { if(!have.has(l.id)){ S.lists.push(l); n++; } });
      const ht = new Set(S.templates.map(t => t.id)); (d.templates || []).forEach(t => { if(!ht.has(t.id)) S.templates.push(t); });
      save(); closeSheet(); render(); toast(`${n} listas recuperadas`);
    }catch(err){ toast("Ese archivo no es una copia válida"); } };
  r.readAsText(file);
}

document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if(!t) return; const f = ACT[t.dataset.act]; if(f){ if(t.tagName === "A") e.preventDefault(); f(t, e); } });
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault(); const v = (f.t.value || "").trim(); if(!v) return;
  const l = getList(view.id);
  if(f.dataset.form === "add"){ const s = l.sections.find(s => s.id === f.dataset.s); s.items.push({id:uid(), t:v, d:false}); save(); render();
    const inp = document.querySelector(`form[data-s="${s.id}"] input`); if(inp) inp.focus(); }
  if(f.dataset.form === "addsec"){ l.sections.push({id:uid(), title:v, items:[]}); save(); render();
    const forms = document.querySelectorAll('form[data-form="add"] input'); const last = forms[forms.length - 1]; if(last) last.focus(); }
});
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset.in; if(!k) return;
  if(k === "ans"){ view.a[el.dataset.q] = el.value; history.replaceState(view, ""); return; }
  const l = getList(view.id); if(!l) return;
  if(k === "lname") l.name = el.value;
  if(k === "stitle") l.sections.find(s => s.id === el.dataset.s).title = el.value;
  if(k === "itext") l.sections.find(s => s.id === el.dataset.s).items.find(i => i.id === el.dataset.i).t = el.value;
  save();
});

/* ============ Arranque ============ */
history.replaceState(view, "");
render();
checkImport();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
